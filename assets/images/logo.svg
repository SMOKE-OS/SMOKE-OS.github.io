<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="smoke-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89B4FA" />
      <stop offset="50%" stop-color="#00AAFF" />
      <stop offset="100%" stop-color="#CBA6F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle rounded rect -->
  <rect width="100" height="100" rx="24" fill="#181825" stroke="#313244" stroke-width="2"/>
  
  <!-- Stylized Smoky Stream S shape -->
  <path d="M 68 32 C 64 24 50 22 38 26 C 26 30 26 42 36 46 C 46 50 64 50 66 64 C 68 76 52 82 38 80 C 28 78 24 72 24 66" 
        stroke="url(#smoke-gradient)" 
        stroke-width="8" 
        stroke-linecap="round" 
        filter="url(#glow)" />
  
  <!-- Subtle vapor dots -->
  <circle cx="70" cy="22" r="3" fill="#89B4FA" opacity="0.8"/>
  <circle cx="78" cy="30" r="2" fill="#94E2D5" opacity="0.6"/>
  <circle cx="28" cy="88" r="2.5" fill="#CBA6F7" opacity="0.7"/>
</svg>
