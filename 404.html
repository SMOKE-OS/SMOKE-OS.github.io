<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | SMOKE OS</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#08090d] text-gray-200 min-h-screen flex items-center justify-center p-4">
  <div class="ambient-glow-1"></div>
  <div class="glass-card max-w-lg w-full p-8 text-center relative z-10 border border-white/10">
    <img src="assets/images/logo-icon.png" alt="SMOKE OS Logo" class="w-20 h-20 mx-auto mb-6 rounded-2xl shadow-xl shadow-emerald-500/20 border border-emerald-500/30">
    <div class="text-xs font-mono uppercase tracking-widest text-emerald-400 mb-2">Error 404</div>
    <h1 class="text-3xl font-extrabold text-white mb-3">Lost in the Smoke</h1>
    <p class="text-sm text-gray-400 mb-8 leading-relaxed">
      The requested route or document could not be found. It may have drifted away or hasn't been created yet.
    </p>
    <div class="flex items-center justify-center gap-4">
      <a href="/" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-400 to-teal-400 text-black font-bold text-sm hover:brightness-110 transition-all shadow-lg shadow-emerald-500/20">
        Return Home
      </a>
      <a href="https://github.com/SMOKE-OS" target="_blank" class="px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 font-medium text-sm transition-colors border border-white/10">
        GitHub
      </a>
    </div>
  </div>
</body>
</html>
